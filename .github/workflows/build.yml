name: Windows hit probe
on: pull_request
jobs:
  windows-hit-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Tests/CCP.Avalonia.Tests -c Release
      - run: bash .github/scripts/avalonia-tests-sharded.sh --shard 0
      - if: always()
        shell: pwsh
        run: Get-Content Tests/CCP.Avalonia.Tests/bin/Release/net10.0/hit-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hit-probe
          path: |
            Tests/CCP.Avalonia.Tests/bin/Release/net10.0/hit-probe.txt
            Tests/CCP.Avalonia.Tests/bin/Release/net10.0/hit-probe.png
