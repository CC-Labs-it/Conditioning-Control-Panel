name: build
on:
  workflow_dispatch:
concurrency:
  group: rcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc-plugin-base
      - run: bash .github/scripts/core-guards.sh
      - run: dotnet build CCP.Avalonia/CCP.Avalonia.csproj -c Release
      - name: filtered tests
        env:
          DiffEngine_Disabled: "true"
          RCHECK_FILTER: 'FullyQualifiedName~TutorialStageTests|FullyQualifiedName~TutorialTourTests|FullyQualifiedName~TutorialAdvanceTests'
        run: |
          set -e
          dotnet test Tests/CCP.Avalonia.Tests/CCP.Avalonia.Tests.csproj -c Release --filter "$RCHECK_FILTER"
          dotnet test Tests/CCP.Core.Tests/CCP.Core.Tests.csproj -c Release --filter "$RCHECK_FILTER"
