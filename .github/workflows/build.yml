name: build
on:
  workflow_dispatch:
concurrency:
  group: rcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc-plugin-base
      - run: bash .github/scripts/core-guards.sh
      - run: dotnet build CCP.Avalonia/CCP.Avalonia.csproj -c Release
      - name: filtered tests
        env:
          DiffEngine_Disabled: "true"
          RCHECK_FILTER: 'FullyQualifiedName~VerifiedRowRenderTests'
        run: |
          set -e
          dotnet test Tests/CCP.Core.Tests/CCP.Core.Tests.csproj -c Release --filter "$RCHECK_FILTER"
  quick-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - run: dotnet build Tests/ConditioningControlPanel.Tests/ConditioningControlPanel.Tests.csproj -c Release -p:ValidateExecutableReferencesMatchSelfContained=false
      - name: filtered WPF tests
        shell: bash
        env:
          DiffEngine_Disabled: "true"
          RCHECK_FILTER: 'FullyQualifiedName~VerifiedRowRenderTests'
        run: |
          set -e
          for i in $(seq 1 1); do echo "== win repeat $i/1"
            dotnet test Tests/ConditioningControlPanel.Tests/ConditioningControlPanel.Tests.csproj -c Release --no-build -p:ValidateExecutableReferencesMatchSelfContained=false --filter "$RCHECK_FILTER"
          done
