name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, windows]
        default: all
        description: 'windows = only the Windows jobs; the Linux half ran locally (bin/rgate hybrid)'

# rgate dispatches this workflow on throwaway avalonia-port/gate-* branches: a newer run there cancels
# the older one. Every other ref gets a group of its own run, so PR and main runs never cancel each other.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/avalonia-port/gate-') && format('build-{0}', github.ref) || format('build-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/avalonia-port/gate-') }}

jobs:
  # THE ANTI-DRIFT JOB. Its entire value is that it runs on a machine where WPF cannot exist:
  # if CCP.Core ever grows a dependency on the Windows head, this job goes red the same day.
  # Do NOT add EnableWindowsTargeting here and do NOT build ConditioningControlPanel here -
  # either change makes the job pass on code that cannot run on Linux, which destroys the
  # only signal we have. The Windows build lives in the `windows` job below, on purpose.
  core-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # 10.0 is what everything targets (LTS, supported to Nov 2028).
          dotnet-version: |
            10.0.x
      - run: dotnet build CCP.Core/CCP.Core.csproj -c Release
      # Core.Tests is the Linux-only behavior gate for the engine. Keep it separate from the
      # smoke runner so persistence/lifecycle regressions report as ordinary test failures.
      # The speech tests need the small Vosk model (~40 MB, not in the repo). Required here, so a
      # failed fetch fails the job instead of silently skipping the engine's only real proof.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccp-test/vosk
          key: vosk-model-small-en-us-0.15-30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498
      - run: bash .github/scripts/fetch-vosk-model.sh
      - run: dotnet test Tests/CCP.Core.Tests/CCP.Core.Tests.csproj -c Release
        env:
          CCP_REQUIRE_VOSK: "1"
      - name: Test Core settings publication (isolated profile)
        run: dotnet test Tests/CCP.Core.Settings.Tests/CCP.Core.Settings.Tests.csproj -c Release
      - name: Test release-content packs (loopback fake server, isolated profile)
        run: dotnet test Tests/CCP.Core.Content.Tests/CCP.Core.Content.Tests.csproj -c Release

      # Compiling for net10.0 proves the type system is satisfied. It does not prove the engine
      # BEHAVES off Windows. This step actually executes Core on Linux and asserts on the answers.
      #
      # It is not redundant with the build above, and it earned its place immediately: on its
      # first run it caught LogScrubber leaking the username out of crash.log on Linux, because
      # the scrubber only knew the C:\Users\ shape. Nothing else could have found that - the TFM
      # guard passed, the grep gate passed, and git recorded a 100% rename.
      #
      # Non-zero exit fails the job.
      - run: dotnet run --project CCP.LinuxSmoke/CCP.LinuxSmoke.csproj -c Release

      # The Linux head. --smoke proves it links against Core and can produce every value the
      # window renders; --render draws the REAL MainWindow offscreen through headless Skia and
      # writes a PNG, which is the only form of visual proof that survives on a runner with no
      # display server. Both exit non-zero on failure.
      # --smoke plays a clip through LibVLC (dummy output); Linux uses the system libvlc.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc-plugin-base
      - run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --smoke
      # The shipped shape: the linux-x64 tarball (publish profile + Vosk model + .desktop + icon) that the
      # Flatpak manifest and the AUR PKGBUILD consume, extracted and smoked with the bundled model required.
      # A workflow artifact only - never a release.
      # The checkout has LFS off: without this the Back Room word clips and music ship as pointer files.
      # Only the LFS files the publish copies (all under Assets/), never the ~680 MB of .ccpmod packs.
      # build-tarball.sh refuses any pointer that is still left.
      - name: Fetch the LFS media the tarball ships
        run: git lfs pull --include "Assets/**"
      - name: Build the linux-x64 tarball and smoke it extracted
        run: |
          tar=$(bash packaging/linux/build-tarball.sh)
          bash packaging/linux/smoke-tarball.sh "$tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-tarball
          path: packaging/linux/out/*.tar.gz
          retention-days: 7
      # Consent runs in its own testhost: CorePaths is process-global and the headless Avalonia
      # lifetime must not share state with the language/notification/scheduler suites.
      - run: dotnet test Tests/CCP.Avalonia.Consent.Tests/CCP.Avalonia.Consent.Tests.csproj -c Release

      # The language, notification and scheduler suites stay separate: each command gets its own
      # testhost and each assembly owns its own process-immutable profile setup.
      - name: Test Avalonia language suite
        run: dotnet test Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj -c Release
      # This suite runs the real desktop startup failure branch against explicit temporary
      # Core/session roots, so it must keep its own testhost and process-global App state.
      - name: Test Avalonia catalogue startup fallback
        run: dotnet test Tests/CCP.Avalonia.CatalogueStartup.Tests/CCP.Avalonia.CatalogueStartup.Tests.csproj -c Release
      # One real desktop startup + shutdown over a copied WPF profile (synthetic fixture in CI;
      # CCP_MIGRATION_PROFILE runs a real profile locally only). Own testhost: UserData is per process.
      - name: Test Avalonia settings migration
        run: dotnet test Tests/CCP.Avalonia.Migration.Tests/CCP.Avalonia.Migration.Tests.csproj -c Release
      # CCP.Avalonia.Tests (sharded, one testhost per shard) runs in the avalonia-linux matrix job below.
      - name: Test Avalonia scheduler gesture
        run: dotnet test Tests/CCP.Avalonia.Scheduler.Tests/CCP.Avalonia.Scheduler.Tests.csproj -c Release
      - name: Test Avalonia report workflow
        run: dotnet test Tests/CCP.Avalonia.Report.Tests/CCP.Avalonia.Report.Tests.csproj -c Release

      - name: Test Avalonia General settings picker (isolated profile)
        run: dotnet test Tests/CCP.Avalonia.GeneralSettings.Tests/CCP.Avalonia.GeneralSettings.Tests.csproj -c Release
      # Linux only: baselines are Linux renders. Own testhost so RenderProof's setup (Inter, Skia) draws them.
      - name: Test snapshot lock of verified parity rows
        run: dotnet test Tests/CCP.Avalonia.Snapshot.Tests/CCP.Avalonia.Snapshot.Tests.csproj -c Release

      # The VR head. Builds and self-checks on ubuntu with no OpenXR runtime and no headset -
      # StereoKit ships natives for linux-x64/arm64 and android-arm64, so the same assembly
      # targets Steam Frame (SteamOS/ARM64) and Quest standalone. Rendering needs a device;
      # asserting it can produce every value it renders does not.
      - run: dotnet run --project CCP.VR/CCP.VR.csproj -c Release -- --smoke
      - run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --render $RUNNER_TEMP/render/MainWindow.png
      # One PNG per ported view. A view that throws on construction fails the job; one that nulls
      # its own template or binds a missing property does NOT - Avalonia keeps bindings silent -
      # so the run prints every binding error per view and the PNGs are the proof. Read them.
      # A native crash (exit 139) leaves a createdump core + crash report (native and managed frames) here;
      # that is how the render-all SIGSEGV was traced to Avalonia's synthetic-typeface copy (SystemEmojiFontCollection).
      - run: |
          mkdir -p $RUNNER_TEMP/dumps
          dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --render-all $RUNNER_TEMP/render
        env:
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: 2
          DOTNET_EnableCrashReport: 1
          DOTNET_DbgMiniDumpName: ${{ runner.temp }}/dumps/core.%p
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-all-crash
          path: ${{ runner.temp }}/dumps/
      # always(): the PNGs matter MOST when a view failed - a reviewer needs the 23 that drew.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-head-render
          path: ${{ runner.temp }}/render/

  # --perf-bench on a real X server (xvfb), not headless: startup, per-tab switch median/p95, working set.
  # The numbers are report-only (docs/avalonia-perf.html; Linux is never compared against WPF). The missing-tab
  # step is NOT report-only: it proves the bench can fail (exit 3), so a broken tab lookup cannot pass silently.
  perf-bench-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'windows'
    runs-on: ubuntu-latest
    env:
      DiffEngine_Disabled: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libvlc-dev vlc-plugin-base
      - run: dotnet build CCP.Avalonia/CCP.Avalonia.csproj -c Release
      - name: perf-bench (report-only)
        continue-on-error: true
        run: |
          export CCP_USERDATA_DIR=$(mktemp -d) XDG_CONFIG_HOME=$(mktemp -d)
          timeout 600 xvfb-run -a -s '-screen 0 1920x1080x24' \
            dotnet run --no-build --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --perf-bench perf-bench-linux.json
      - name: perf-bench fails on a missing tab (must exit 3)
        run: |
          export CCP_USERDATA_DIR=$(mktemp -d) XDG_CONFIG_HOME=$(mktemp -d)
          set +e
          timeout 300 xvfb-run -a -s '-screen 0 1920x1080x24' \
            dotnet run --no-build --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --perf-bench missing.json --perf-bench-tabs SettingsTab,NoSuchTab
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then echo "--perf-bench with a missing tab exited $code, expected 3"; exit 1; fi
          if [ -e missing.json ]; then echo "--perf-bench wrote JSON for a failed run"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: perf-bench-linux
          path: perf-bench-linux.json
          if-no-files-found: warn
          retention-days: 30

  glassroad:
    if: github.base_ref == 'feat/glassroad-a' || startsWith(github.head_ref, 'codex/glassroad-smooth-')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Glassroad
        working-directory: Assets/web/glassroad
        env:
          NODE_OPTIONS: --max-old-space-size=384
        run: |
          $tests = Get-ChildItem tests -Filter '*.test.mjs' | ForEach-Object { "tests/$($_.Name)" }
          node --test --test-concurrency=2 --test-timeout=180000 @tests

  # The "behaves identically on Windows" gate.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      # The -p: flag is required, not cosmetic. ConditioningControlPanel.csproj is SelfContained
      # + win-x64; ConditioningControlPanel.Tests sets a RID but NOT SelfContained and
      # ProjectReferences the app, which the .NET 10 SDK rejects with NETSDK1151 (the .NET 8 SDK
      # allowed it). Without a global.json the highest installed SDK wins, so the plain command
      # fails - verified on SDK 10.0.111. Suppressing the validation on the command line rather
      # than editing either .csproj keeps what ships byte-for-byte unchanged.
      # NOT -p:SelfContained=true: that also works for the app, but it is a global property, so
      # it hits CCP.Core.Tests too, which has no RuntimeIdentifier by design - that combination
      # fails with NETSDK1191 ("a runtime identifier for the property 'SelfContained' couldn't
      # be inferred"). Verified both ways.
      # Drop the flag if the solution ever builds clean without it.
      - name: Build solution (hard gate)
        run: dotnet build ConditioningControlPanel.sln -c Release -p:ValidateExecutableReferencesMatchSelfContained=false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shared Loom renderer exports
        run: node --test Assets/web/dtrh/tests/loom-renderer-exports.test.mjs

      # HARD GATE. This started advisory - the suite is 254 files including WpfRenderHarness.cs
      # and PlayDoorRenderTests.cs, which do real WPF rendering, and nobody had confirmed it
      # green on a headless runner. The first CI run settled it: 4924 passed, 0 failed, in 45s,
      # render tests included. Promoted on that one green run, deliberately - an advisory job
      # that is always green trains everyone to ignore it. If it turns out flaky, demote it with
      # evidence (link the failing runs) rather than pre-emptively.
      - name: Test app suite
        run: dotnet test Tests/ConditioningControlPanel.Tests/ConditioningControlPanel.Tests.csproj -c Release -p:ValidateExecutableReferencesMatchSelfContained=false
      - name: Test Core suite
        run: dotnet test Tests/CCP.Core.Tests/CCP.Core.Tests.csproj -c Release
      - name: Test Core settings publication (isolated profile)
        run: dotnet test Tests/CCP.Core.Settings.Tests/CCP.Core.Settings.Tests.csproj -c Release
      - name: Test release-content packs (loopback fake server, isolated profile)
        run: dotnet test Tests/CCP.Core.Content.Tests/CCP.Core.Content.Tests.csproj -c Release
      # Keep these as separate invocations: the language, notification and scheduler assemblies
      # need independent testhost processes and isolated process-immutable profiles.
      - name: Test Avalonia language suite
        run: dotnet test Tests/CCP.Avalonia.Language.Tests/CCP.Avalonia.Language.Tests.csproj -c Release
      - name: Test Avalonia catalogue startup fallback
        run: dotnet test Tests/CCP.Avalonia.CatalogueStartup.Tests/CCP.Avalonia.CatalogueStartup.Tests.csproj -c Release
      # One real desktop startup + shutdown over a copied WPF profile (synthetic fixture in CI;
      # CCP_MIGRATION_PROFILE runs a real profile locally only). Own testhost: UserData is per process.
      - name: Test Avalonia settings migration
        run: dotnet test Tests/CCP.Avalonia.Migration.Tests/CCP.Avalonia.Migration.Tests.csproj -c Release
      # CCP.Avalonia.Tests (sharded, one testhost per shard) runs in the avalonia-windows matrix job below.
      - name: Test Avalonia scheduler gesture
        run: dotnet test Tests/CCP.Avalonia.Scheduler.Tests/CCP.Avalonia.Scheduler.Tests.csproj -c Release
      - name: Test Avalonia report workflow
        run: dotnet test Tests/CCP.Avalonia.Report.Tests/CCP.Avalonia.Report.Tests.csproj -c Release
      - name: Test Avalonia consent flow
        run: dotnet test Tests/CCP.Avalonia.Consent.Tests/CCP.Avalonia.Consent.Tests.csproj -c Release
      - name: Test Avalonia General settings picker (isolated profile)
        run: dotnet test Tests/CCP.Avalonia.GeneralSettings.Tests/CCP.Avalonia.GeneralSettings.Tests.csproj -c Release
      # The only place the Win32 overlay shim (CCP.Avalonia/Platform/Win32Overlay.cs) runs: opens a
      # click-through topmost overlay per screen and reads ex-style bits, visibility and rect back
      # from user32. Prints SKIP and exits 0 when the runner has no desktop session.
      # ADVISORY until its first green run (same rule as the app suite above): the shim has never
      # executed anywhere yet. Drop continue-on-error once a run is green.
      - name: Avalonia overlay check (Win32 shim)
        continue-on-error: true
        timeout-minutes: 5
        run: dotnet run --project CCP.Avalonia/CCP.Avalonia.csproj -c Release -- --overlay-check
      # The installer's input (Properties/PublishProfiles/win-x64.pubxml, WPF's settings). WinExe has no
      # console, so Start-Process -Wait is what makes the exit code reach the step.
      - name: Publish win-x64 and smoke the published exe
        timeout-minutes: 20
        run: |
          dotnet publish CCP.Avalonia/CCP.Avalonia.csproj -c Release -p:PublishProfile=win-x64
          # WinExe has no console: capture the smoke's own report, or a failure says only "exited 1".
          $p = Start-Process -FilePath CCP.Avalonia\bin\publish\win-x64\CCP.Avalonia.exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -ne 0) { throw "--smoke exited $($p.ExitCode)" }
      # The WH_KEYBOARD_LL panic hook (Platform/Win32PanicKey.cs) on a real desktop: injects F24 and
      # asserts one press stops, a held key is one press, two presses exit. The F23 run binds a key that
      # is never pressed, so it MUST fail: proof the check can fail. Sandbox profile only.
      - name: Avalonia Windows panic key check (WH_KEYBOARD_LL)
        timeout-minutes: 5
        run: |
          $exe = 'CCP.Avalonia\bin\publish\win-x64\CCP.Avalonia.exe'
          function Check($key) {
            $env:CCP_USERDATA_DIR = Join-Path $env:RUNNER_TEMP "panic-$key"
            $p = Start-Process -FilePath $exe -ArgumentList '--win-panic-check', $key -Wait -PassThru -NoNewWindow -RedirectStandardOutput "panic-$key.out" -RedirectStandardError "panic-$key.err"
            Get-Content "panic-$key.out", "panic-$key.err" | Out-Host
            return $p.ExitCode
          }
          $ok = Check 'F24'
          if ($ok -ne 0) { throw "--win-panic-check F24 exited $ok" }
          $neg = Check 'F23'
          if ($neg -eq 0) { throw '--win-panic-check F23 passed: the check cannot fail' }

  # CCP.Avalonia.Tests, one shard per job so the shards run in parallel instead of one after another.
  # Sharded: one testhost for the whole suite outgrew the 16 GB runner; the shard definitions live in
  # .github/scripts/avalonia-tests-sharded.sh, the last shard is the complement of the others.
  avalonia-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'windows'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccp-test/vosk
          key: vosk-model-small-en-us-0.15-30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498
      - run: bash .github/scripts/fetch-vosk-model.sh
      # LibVLC tests use the system libvlc, like --smoke in core-linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc-plugin-base
      - run: dotnet build Tests/CCP.Avalonia.Tests/CCP.Avalonia.Tests.csproj -c Release
      - name: Test Avalonia notification suite (shard ${{ matrix.shard }})
        run: bash .github/scripts/avalonia-tests-sharded.sh --shard ${{ matrix.shard }}
        env:
          CCP_REQUIRE_VOSK: "1"
      - name: Record the suite's test count for the coverage check
        if: ${{ !cancelled() }}
        run: bash .github/scripts/avalonia-tests-sharded.sh --expected > avalonia-expected.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: avalonia-linux-shard-${{ matrix.shard }}
          path: |
            avalonia-shard-${{ matrix.shard }}.total
            avalonia-expected.txt
          retention-days: 7

  # Sharded like ubuntu: one testhost ran out of memory here too ("Unable to allocate pixels",
  # OutOfMemoryException 32 min into run 38144551173, failing three unrelated tests).
  avalonia-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet build Tests/CCP.Avalonia.Tests/CCP.Avalonia.Tests.csproj -c Release
      - name: Test Avalonia notification suite (shard ${{ matrix.shard }})
        shell: bash
        run: bash .github/scripts/avalonia-tests-sharded.sh --shard ${{ matrix.shard }}
      - name: Record the suite's test count for the coverage check
        if: ${{ !cancelled() }}
        shell: bash
        run: bash .github/scripts/avalonia-tests-sharded.sh --expected > avalonia-expected.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: avalonia-windows-shard-${{ matrix.shard }}
          path: |
            avalonia-shard-${{ matrix.shard }}.total
            avalonia-expected.txt
          retention-days: 7

  # The coverage guarantee the sequential script used to give: the shards' Total: counts must add up to
  # the suite's own --list-tests count, so a test can never fall between shards (or a shard go missing).
  # !cancelled() also keeps this running when avalonia-linux is skipped (scope=windows).
  # A partial rerun can leave a prerequisite cancelled without cancelling this attempt. It has
  # no complete shard set to count; keep the cancelled prerequisite as the blocking result.
  # Failed (but not cancelled) shards still reach the strict coverage check below.
  avalonia-coverage:
    needs: [avalonia-linux, avalonia-windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scope=windows (hybrid rgate): the Linux shards ran locally, so only the Windows total is checked here.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'windows' && '["windows"]' || '["linux", "windows"]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: avalonia-${{ matrix.os }}-shard-*
          path: shards
      - name: Shard totals must add up to the suite
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat shards/*/avalonia-expected.txt | tr -d '\r' | sort -u)
          [ "$(wc -l <<<"$expected")" -eq 1 ] || { echo "::error::shards disagree on the suite size: $expected"; exit 1; }
          ran=0; n=0
          for f in shards/*/avalonia-shard-*.total; do ran=$((ran + $(tr -d '\r' < "$f"))); n=$((n + 1)); done
          echo "avalonia ${{ matrix.os }} shards ran $ran of $expected tests ($n shard files)"
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::Avalonia ${{ matrix.os }} shards ran $ran tests but the suite lists $expected"
            exit 1
          fi

  # build-content-packs.ps1 is Windows-only (\\?\ long paths), so its proof runs here.
  # (a) The committed install-relative [InstallDelete] list must regenerate unchanged.
  # (b) Today's script on the Assets-move commit must zip byte-for-byte what the old script zipped
  #     on its parent. .ccpmod files are LFS pointers on both sides (no LFS pull), so those three
  #     zips prove the entry layout, not the archive bytes.
  # Greps the compiler cannot do: APIs that compile fine in a net10.0 library and only fail at
  # runtime, plus the XAML clr-namespace tripwire. See the script for what and why.
  core-guards:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'windows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/core-guards.sh
      # The port docs parse: every ledger table row on one line, main-sync meta totals match, the dashboard builds
      # (shallow checkout, so its over-time chart has one point here; that is fine for a build check).
      - run: |
          python3 .github/scripts/avalonia_docs.py
          python3 - <<'PY'
          import glob, sys
          sys.path.insert(0, ".github/scripts"); import avalonia_docs as A
          bad = []
          for p in glob.glob("docs/avalonia-*.html"):
              t = open(p, encoding="utf-8").read()
              bad += [f"{p}:{n}: table row spans lines" for n in A.bad_lines(t)]
              m = A.meta(t)
              if p.startswith("docs/avalonia-main-sync-"):
                  n = len([r for r in A.rows(t, "#") if r.get("sha", "").startswith("`")])
                  if not m or m.get("total") != n: bad.append(f"{p}: {n} rows, ledger-meta {m}")
          print("\n".join(bad) or "port docs OK"); sys.exit(1 if bad else 0)
          PY
          python3 .github/scripts/port-dashboard.py . --out "$RUNNER_TEMP/dashboard.html"
