<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile frames</title>
<!-- Dev sheet: every profile frame at list, card and stage size, and a six-step motion strip (sheet/frames.js).
     ?t=<seconds> holds one moment; ?motion=less|off; ?gentle; ?live animates the strips. -->
<style>
  body { margin: 0; background: #241433; color: #fff6dc; font: 600 13px "Segoe UI", sans-serif; }
  .row { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid #ffffff14; }
  .row b { width: 120px; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import { FRAME_IDS, drawFramed, frameMotion } from '../sheet/frames.js';
const q = new URLSearchParams(location.search), m = frameMotion(q.get('motion') || 'full', q.has('gentle'));
const img = new Image(); img.src = '../assets/preview/profile/profile.avatar.emi-pixel.png';
const cells = [];
for (const id of FRAME_IDS) {
  const row = document.createElement('div'); row.className = 'row';
  const name = document.createElement('b'); name.textContent = id.split('.').pop(); row.append(name);
  for (const [size, t] of [[36, 0], [133, 0], [260, 0], ...[0, 0.55, 1.1, 1.65, 2.2, 2.75].map((t) => [133, t])]) {
    const cv = document.createElement('canvas'), d = devicePixelRatio || 1;
    cv.width = size * d; cv.height = size * d; cv.style.width = cv.style.height = size + 'px';
    row.append(cv); cells.push({ cv, id, size, t, d });
  }
  document.body.append(row);
}
const at = q.has('t') ? Number(q.get('t')) : null;
function paint(now) {
  for (const c of cells) {
    const g = c.cv.getContext('2d'); g.setTransform(c.d, 0, 0, c.d, 0, 0); g.clearRect(0, 0, c.size, c.size);
    drawFramed(g, c.id, img, 0, 0, c.size, (at ?? 0) + c.t + (q.has('live') ? now / 1000 : 0), m);
  }
  if (q.has('live')) requestAnimationFrame(paint);
}
img.onload = () => paint(0); img.onerror = () => paint(0);
</script>
</body>
</html>
