<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Racing Thoughts</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.webgpu.min.js",
      "three/webgpu": "./vendor/three/build/three.webgpu.min.js",
      "three/tsl": "./vendor/three/build/three.tsl.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./hud/garage.css">
  <link rel="stylesheet" href="./hud/loading.css">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a12; color: #f4eef8; overflow: hidden; }
    #view { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
    #card { position: fixed; inset: 0; display: grid; place-items: center; font: 16px/1.4 system-ui, sans-serif; }
    /* above the touch layer (input/touch.js, z 12): the HUD item slot takes taps, the cards take every press */
    #hud { z-index: 13; }
    #card { z-index: 14; }
    #card[hidden] { display: none; }
  </style>
</head>
<body data-boot="loading">
  <section id="race-loading" aria-label="Loading Racing Thoughts"><div class="boot-card"><p class="boot-eyebrow">CC LABS</p><h1 class="boot-title"><span>racing</span><b>thoughts</b></h1>
    <div class="boot-ride" aria-hidden="true"><svg viewBox="0 0 52 38"><path d="M9 26h34l-3 7H12ZM17 26V14h19v12M22 20h2m5 0h2m-7 3h5M27 14V7"/><circle cx="27" cy="5" r="2"/><path d="M7 33h38M14 37h4m17 0h4"/></svg></div>
    <p class="boot-stage" role="status">Opening the garage</p><div class="boot-progress" role="progressbar" aria-label="Loading Racing Thoughts" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="boot-fill"></div></div><span class="boot-percent">0%</span>
    <p class="boot-reason" hidden></p><button type="button" class="boot-retry" hidden>Retry</button>
  </div></section>
  <canvas id="view" tabindex="0" aria-label="Race view"></canvas>
  <div id="hud"></div>
  <div id="card" data-kind="start">
    <div class="card-body">
      <h1 class="card-title">Threshold</h1>
      <p class="card-note" id="card-note">Warming up</p>
      <button type="button" id="card-go" disabled>Start</button>
    </div>
  </div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
