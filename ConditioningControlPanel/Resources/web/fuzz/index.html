<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terms &amp; Conditioning</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ui/legal.css">
</head>
<body>
  <div id="world">
    <div id="l-back" class="layer"></div>
    <div id="l-wash" class="layer"></div>
    <div id="l-screens" class="layer"></div>
    <div id="page">
      <main id="stage">
        <div id="l-ticker" class="ticker"></div>
        <div id="counter" aria-live="off"><span id="count">0</span> <span id="cur"></span></div>
        <div id="l-meters"></div>
        <p id="phrase" hidden>Click here to Accept the Terms and Conditioning</p>
        <div id="btn-zone"><div id="btn-wrap"><button id="btn" type="button">Click</button><span id="btn-lock" hidden></span></div></div>
      </main>
      <div id="l-banner"></div>
      <section id="shop" aria-label="Shop" hidden>
        <div id="goal"></div>
        <div id="rows"></div>
        <div id="more" hidden></div>
      </section>
    </div>
    <div id="l-floaters" class="layer"></div>
    <div id="l-side"><div class="rail left"></div><div class="rail right"></div></div>
    <div id="l-over" class="layer"></div>
    <div id="l-fx" class="layer"></div>
    <div id="l-toast"></div>
    <div id="l-ending" class="layer"></div>
  </div>

  <div id="cards"></div>

  <div id="pause" class="backdrop" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-label="Paused">
      <h2>Paused</h2>
      <p class="card-sub">Everything is stopped and muted.</p>
      <div class="card-buttons"><button id="resume" type="button" class="primary">Resume</button></div>
      <label class="check"><input id="mute" type="checkbox"> Mute</label>
      <label class="check"><input id="gentle" type="checkbox"> Gentle visuals</label>
      <div class="pics-row"><span id="pics-now"></span><button id="pics-change" type="button">Change</button></div>
      <div class="card-buttons small">
        <button id="save-out" type="button" hidden>Export save</button>
        <button id="save-in" type="button" hidden>Import save</button>
        <button id="forget" type="button">Forget everything</button>
        <button id="leave" type="button" hidden>Leave</button>
      </div>
      <textarea id="save-box" rows="3" hidden spellcheck="false" aria-label="Save"></textarea>
    </div>
  </div>

  <button id="wake" type="button">Wake Up</button>

  <script type="module" src="main.js"></script>
</body>
</html>
