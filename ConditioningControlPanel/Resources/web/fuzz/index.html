<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Untitled</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="spiral" class="spiral" aria-hidden="true"></canvas>
  <div id="pinkwash" class="pinkwash" aria-hidden="true"></div>

  <header class="top">
    <div id="ticker" class="ticker" hidden></div>
    <button id="wake" class="wake" type="button">Wake Up</button>
  </header>

  <main id="stage" class="stage">
    <div class="counter">
      <div id="fuzz" class="fuzz" aria-live="off">0 Fuzz</div>
      <div id="fps" class="fps" hidden>0 Fuzz per second</div>
      <div id="meters" class="meters"></div>
    </div>
    <button id="bubble" class="bubble" type="button" aria-label="Pop">
      <img src="assets/img/bubble.png" alt="" draggable="false">
    </button>
    <section id="shop" class="shop" aria-label="Shop"></section>
  </main>

  <div id="widgets" class="widgets"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <div id="pause" class="pause" hidden>
    <div class="card">
      <p class="card-title">Paused</p>
      <div class="card-rows">
        <button id="resume" type="button">Resume</button>
        <label><input id="mute" type="checkbox"> Mute</label>
        <label><input id="photosafe" type="checkbox"> Photosafe</label>
        <button id="export" type="button">Export save</button>
        <button id="forget" type="button" data-sure="">Forget everything</button>
      </div>
      <textarea id="exportbox" rows="3" readonly hidden></textarea>
    </div>
  </div>

  <div id="ending" class="ending" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
