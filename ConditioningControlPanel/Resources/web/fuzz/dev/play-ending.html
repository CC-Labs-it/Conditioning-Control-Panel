<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play an ending</title>
<link rel="icon" href="../assets/img/bubble.png">
<style>
  :root { color-scheme:light; font:15px/1.4 'Segoe UI',sans-serif; color:#301c33; background:#f8f3f7 }
  * { box-sizing:border-box } html,body { margin:0; height:100% }
  iframe { display:block; width:100%; height:100%; border:0 }
  #note { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#fff; color:#301c33;
    border:1px solid #c6aabc; border-radius:10px; padding:10px 16px; box-shadow:0 6px 24px rgba(48,28,51,.18);
    max-width:min(92vw,560px); z-index:9; transition:opacity .6s }
  #note.gone { opacity:0; pointer-events:none }
  #note b { color:#9a2a74 }
  #note button { padding:8px 14px; min-height:44px; font:inherit; font-weight:600; cursor:pointer }

</style>
</head>
<body>
<iframe id="game" title="Terms & Conditioning" allow="autoplay"></iframe>
<div id="note">Loading the run...</div>
<script type="module">
/* Dev launcher: lands a filled run one shop buy away from an ending (local 8817 host only, dev doors).
   ?end=bi_end (default)    the ending item; its chain is granted and the wallet topped up to afford it
   ?buy=a,b,c               extra items on top of the basics
   ?pictures=online         passed on to the game (placeholder art), like ?lite
   The game runs standalone in a same-origin frame (8817 is not a web host origin), so audio and the page are the real thing. */
import { BY_ID } from '../data/items.js';
import * as E from '../sim/economy.js';
const qs = new URLSearchParams(location.search);
const endId = qs.get('end') || 'bi_end';
const end = BY_ID[endId];
const note = document.getElementById('note');
if (!end || end.kind !== 'end') { note.textContent = `No ending item "${endId}".`; throw new Error(note.textContent); }
const basics = ['colour', 'font', 'sound', 'rounded', 'softw', 'a_rain', 'v_frame', 'wheel', 'quiz', 'toy_box', 'mini_breakout', 'mini_slots', 'word_comet'];
const extra = (qs.get('buy') || '').split(',').map((s) => s.trim()).filter(Boolean);
/* ?from=go_tx: land one row before that item instead, with the rows from it up to the ending left to buy by hand.
   The wallet covers all of them, so the player buys each one when they choose. */
const fromId = qs.get('from') || (endId === 'go_end' ? 'go_tx' : null);
const from = fromId ? BY_ID[fromId] : null;
if (fromId && !from) { note.textContent = `No item "${fromId}".`; throw new Error(note.textContent); }
const held = new Set();
if (from) {
  for (let id = endId; id && id !== fromId; id = BY_ID[id].req.find((r) => BY_ID[r]?.lane === end.lane)) held.add(id);
  held.add(fromId);
}
const buy = [...new Set([...(from ? from.req : end.req), ...basics, ...extra])]; // the theme chain first: a side item that needs the theme fork would otherwise pick its first option
const frame = document.getElementById('game');
const demoReel = qs.get('reel') === 'demo' && ['localhost','127.0.0.1'].includes(location.hostname);
const bubble = endId === 'bi_end';
if (bubble) note.hidden = true;
const previewQuery = new URLSearchParams({ buy: buy.join(',') });
for (const key of ['pictures', 'lite']) {
  if (qs.has(key)) previewQuery.set(key, qs.get(key));
}
if (bubble) previewQuery.set('pictures', demoReel ? 'none' : 'scrolller');
// Without an explicit test source, EMI starts with the normal opt-in picture chooser.
if (endId === 'go_end' && !qs.has('pictures')) previewQuery.set('pictures', 'scrolller');
frame.src = '../index.html?' + previewQuery;
frame.addEventListener('load', () => {
  const t0 = performance.now();
  const tick = async () => {
    const fuzz = frame.contentWindow?.fuzz;
    if (!fuzz) { if (performance.now() - t0 < 20000) return void setTimeout(tick, 100); note.textContent = 'The game did not start.'; return; }
    const run = fuzz.state;
    const finishPath = () => {
      if (!E.mainPathDone(run) && end.req.every(id => E.has(run, id))) {
        for (const id of BY_ID.drop.req) fuzz.grant(id);
      }
    };
    if (bubble && !run.clock) return void setTimeout(tick, 100);
    if (!from) finishPath();
    if (bubble && !from) {
      // The source chooser starts this in-memory run. Its first real clock tick means the toys are mounted.
      if (demoReel) {
        try {
          const files = await Promise.all([1, 2, 3, 4].map(async n => {
            const filename = `demo-${n}.webm`;
            const response = await fetch(`./bambi-demo/${filename}`);
            if (!response.ok) throw new Error(filename);
            return new frame.contentWindow.File([await response.blob()], filename, { type: 'video/webm' });
          }));
          fuzz.engine.pictures.addOwn(files);
          fuzz.engine.pictures.setSource('own');
        } catch {
          note.hidden = false;
          note.textContent = 'The sample clips could not load. Reload to retry.';
          return;
        }
      }
      fuzz.add(Math.max(0, fuzz.engine.price(endId) - run.fuzz) + 1);
      // Let each widget finish its first layout before freezing the page for the swallow.
      frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(() => {
        fuzz.engine.audio.arm();
        if (fuzz.buy(endId).ok) { note.remove(); frame.focus(); frame.contentWindow.focus(); }
        else { note.hidden = false; note.textContent = 'The ending could not start. Reload to retry.'; }
      }));
      return;
    }
    /* Buy out everything else that is open (riders open more rows, so loop), so the ending is the only tile left in the
       shop window beside Endless Mode. The trunk fork row stays as the goal; forks and endings are never granted here. */
    // Keep power-ups on EMI's shelf for her to take over during the finale.
    const takeover = endId === 'go_end';
    // Hive Mind is the final purchase. The swarm finishes the run through play.
    let guard = from || takeover || endId === E.FALLBACK_ENDING ? 0 : 240;
    for (;;) {
      const next = guard-- > 0 && E.openItems(run).find((i) => i.kind !== 'end' && i.kind !== 'fork' && i.id !== 'taste2' && !held.has(i.id));   // Second Theme asks a question of its own: leave it as the goal row
      if (!next) break;
      if (!E.has(run, next.id)) { fuzz.grant(next.id); continue; }
      // A repeat row (another copy, a rank) stays open while owned: grant refuses those, so buy it with the dev wallet.
      const p = fuzz.engine.price(next.id);
      if (run.fuzz < p) fuzz.add(p - run.fuzz + 1);
      const before = E.count(run, next.id);
      fuzz.buy(next.id);
      if (E.count(run, next.id) === before) break;
    }
    /* The preview grants the upgrades. Give each poster preview a set of sample tallies. */
    if (['o_out', 'outside', 'dr_end'].includes(endId)) {
      const tally = ((run.store ||= {}).adcard ||= {});
      tally.pics ||= 420;
      tally.golden ||= 12;
      tally.terms ||= 160;
    }
    if (from) {
      const want = Math.round([...held].reduce((sum, id) => sum + E.price(run, id), 0) * 1.1);
      if (run.fuzz < want) fuzz.add(want - run.fuzz);
      // The normal shop owns pricing, affordability, the terms card and the purchase.
      // Bring this chain into view while leaving later steps locked behind their parents.
      fuzz.engine.env.featuredShop.unshift(...held);
      if (!takeover) {
        finishPath();
        fuzz.engine.subscribe('buy', finishPath);
      }
      fuzz.ui.draw(true);
      note.remove();
      frame.focus();
      return;
    }
    const want = Math.round(E.price(run, endId) * 1.05);
    if (run.fuzz < want) fuzz.add(want - run.fuzz);
    fuzz.ui.draw(true);
    if (endId === 'dr_end' || endId === 'outside') {
      // A crowded ending preview can put a toy or a setup card over its shop tile.
      const play = document.createElement('button');
      play.textContent = endId === 'outside' ? 'Play Go Outside' : 'Play Unit Complete';
      note.replaceChildren(play);
      play.addEventListener('click', () => {
        fuzz.engine.audio.arm();
        if (fuzz.buy(endId).ok) { note.remove(); frame.focus(); }
      });
      fuzz.engine.subscribe('ending', () => note.remove());
      return;
    }
    const style = frame.contentDocument.createElement('style');
    style.textContent = `#shop [data-id="${endId}"]{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 9px #ff2f9a,0 0 40px #ff2f9a;animation:pe-pulse 1s ease-in-out infinite alternate}
      @keyframes pe-pulse{from{transform:scale(1)}to{transform:scale(1.08)}}`;
    frame.contentDocument.head.appendChild(style);
    note.innerHTML = `Sound on. The glowing shop tile is <b>${end.name}</b>: buy it, press Yes. Wake Up still works the whole time.`;
    setTimeout(() => note.classList.add('gone'), 14000);
    frame.focus();
  };
  tick();
});
</script>
</body>
</html>
