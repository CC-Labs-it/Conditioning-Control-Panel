<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <!-- Mandatory-video surface for the hybrid Browser Video Engine.
       The host window is already OS-level fullscreen borderless, so this page
       NEVER calls requestFullscreen (plan trap #6) and draws no chrome at all.

       #bg is a tiny canvas painted from #fg a few times a second while
       blurBackground is on (body.has-bg). It used to be a second <video> decoding
       the same file under a full-screen 40px CSS blur, which dropped frames on
       some GPUs (#1257). -->
  <div id="stage">
    <canvas id="bg" width="96" height="54"></canvas>
    <video id="fg" playsinline preload="auto" disablepictureinpicture></video>
  </div>
  <!-- Attention-check targets (attentionShow / attentionHide). The only
       hit-testable thing on the page: the layer itself passes presses through,
       each target takes its own and reports attentionClick INSTEAD of the
       generic click. C# still owns the text, the styling and the schedule. -->
  <div id="attn"></div>
  <!-- "via Scrolller" credit (load field `credit`, Scrolller clips only): a corner
       badge while the clip plays and an end card after it. Brand text, never
       translated. Pressable only when the load says clickable. -->
  <div id="credit" class="credit-link" hidden>
    <span class="credit-via">via</span><span class="credit-mark">Scrolller</span><span class="credit-sub" data-credit="sub"></span><span class="credit-tick">&#10003;</span>
  </div>
  <div id="outro" class="credit-link" hidden>
    <div class="outro-card">
      <div class="outro-via">via</div>
      <div class="outro-mark">Scrolller</div>
      <div class="outro-sub" data-credit="sub"></div>
      <div class="outro-site"><span data-credit="site"></span><span class="credit-tick">&#10003;</span></div>
    </div>
  </div>
  <script src="player.js"></script>
</body>
</html>
