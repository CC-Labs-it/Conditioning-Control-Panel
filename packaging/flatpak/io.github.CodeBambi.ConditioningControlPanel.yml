# Flatpak for the own-repo channel (docs/avalonia-linux-install.html). Consumes the tarball from
# packaging/linux/build-tarball.sh: copy it next to this file as ConditioningControlPanel-linux-x64.tar.gz.
# A release swaps `path:` for `url:` + `sha256:` of the uploaded asset. Not submitted to Flathub.
# GNOME 50 already ships webkit2gtk-4.1, libsecret, libXi and libpulse; libVLC is bundled below.
# WPE WebKit is NOT bundled: WebHost defaults to WebKitGTK (runtime has webkit2gtk-4.1 + autoaudiosink) and WPE is
# opt-in only (CCP_LINUX_WEBVIEW=wpe, falls back to GTK when libWPEWebKit is absent); docs/avalonia-decisions.html.
app-id: io.github.CodeBambi.ConditioningControlPanel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: conditioning-control-panel
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11            # overlays and the X11 panic key need X11/XWayland, not fallback-x11
  - --socket=pulseaudio     # LibVLC output and the parec mic
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Tray: Avalonia owns org.kde.StatusNotifierItem-<pid>-<n>, n +1 per watcher restart; the app is pid 2 in the
  # sandbox. finish-args reject a "-*" wildcard (Invalid dbus name), so the names are listed.
  - --own-name=org.kde.StatusNotifierItem-2-0
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --own-name=org.kde.StatusNotifierItem-2-2
  - --own-name=org.kde.StatusNotifierItem-2-3
modules:
  # ponytail: minimal libVLC (audio/video decode + pulse/xcb/gl output), no GUI or Lua; add modules when a format fails.
  - name: vlc
    build-options:
      env:
        BUILDCC: gcc -std=gnu99   # vlc 3 configure finds no "c99" binary in the GNOME 50 Sdk
    config-opts:
      - --disable-lua
      - --disable-qt
      - --disable-skins2
      - --disable-ncurses
      - --disable-vlc
      - --disable-a52
      - --disable-nls
      - --disable-srt
      - --disable-chromecast
      - --disable-dbus
      - --enable-avcodec
      - --enable-avformat
      - --enable-swscale
      - --enable-pulse
    cleanup:
      - /bin
      - /include
      - /share/man
    sources:
      - type: archive
        # 3.0.24: 3.0.21 does not build against the Sdk's FFmpeg (AVCodecContext.channels removed)
        url: https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf
  - name: conditioning-control-panel
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ccp && cp -a . /app/lib/ccp/
      - mkdir -p /app/bin && printf '#!/bin/sh\nexec /app/lib/ccp/CCP.Avalonia "$@"\n' > /app/bin/conditioning-control-panel
      - chmod 755 /app/bin/conditioning-control-panel
      - cp -a share/. /app/share/
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.CodeBambi.ConditioningControlPanel
    sources:
      - type: archive
        path: ConditioningControlPanel-linux-x64.tar.gz
