<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The system config (relative: found on fontconfig's own config path), minus Type 1 faces (Program.HideType1Fonts). -->
<fontconfig>
  <include ignore_missing="yes">fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="fontformat"><string>Type 1</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
